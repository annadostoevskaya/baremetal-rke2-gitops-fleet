apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet-infrastructure
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/annadostoevskaya/baremetal-rke2-gitops-fleet.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/flux-system/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-infrastructure
  interval: 10m0s
  path: ./gitops/flux-system/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-infrastructure
